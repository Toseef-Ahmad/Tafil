    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is TAFIL really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The free version includes unlimited projects, markdown notes, Kanban boards, and works 100% offline. Pro is optional and unlocks advanced features like SSH integration."
          }
        },
        {
          "@type": "Question",
          "name": "Does TAFIL require internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. TAFIL works 100% offline. All your data stays on your machine. License activation needs internet once, then works forever offline."
          }
        },
        {
          "@type": "Question",
          "name": "What platforms are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TAFIL runs on macOS (Intel & Apple Silicon), Windows 10/11, and Linux (Ubuntu, Fedora, Debian via AppImage)."
          }
        },
        {
          "@type": "Question",
          "name": "Is TAFIL an IDE?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. TAFIL works alongside your favorite IDE (VS Code, Cursor, WebStorm) as a project command center. It helps you manage and organize projects, not edit code."
          }
        },
        {
          "@type": "Question",
          "name": "What's the difference between Free and Pro?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Free includes unlimited projects, notes, and Kanban boards. Pro ($49 one-time) adds SSH integration, advanced code playground with npm packages, Excalidraw canvas, wiki-style note linking, and priority support."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use TAFIL on multiple devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Pro license includes 3 device activations, so you can use it on your work laptop, home desktop, and another machine."
          }
        }
      ]
    }
    </script>
